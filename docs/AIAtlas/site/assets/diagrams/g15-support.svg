SpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="g15-support-arrow-probe" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/></marker><marker id="g15-support-arrow-hit" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="g15-support-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="g15-support-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="g15-support-arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="780" height="400" fill="#ffffff"/><rect x="30.0" y="270.0" width="285.0" height="18.0" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/><circle cx="120.0" cy="270.0" r="6.0" fill="#c2410c" stroke="#c2410c" stroke-width="1.5"/><line x1="120.0" y1="270.0" x2="120.0" y2="135.0" stroke="#c2410c" stroke-width="2" stroke-dasharray="4 3"/><text x="112.5" y="127.5" font-family="Segoe UI, Noto Sans, Arial, sans-serif" font-size="12" fill="#c2410c" text-anchor="middle" font-weight="normal">основание b</text><line x1="120.0" y1="270.0" x2="232.5" y2="270.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="232.5" y1="270.0" x2="232.5" y2="232.5" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="232.5" cy="232.5" r="5.0" fill="#0ea5e9" stroke="#0ea5e9" stroke-width="1.5"/><line x1="232.5" y1="232.5" x2="232.5" y2="322.5" stroke="#15803d" stroke-width="3" marker-end="url(#g15-support-arrow-ok)"/><text x="241.5" y="252.0" font-family="Segoe UI, Noto Sans, Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="start" font-weight="normal">луч вниз 0.60</text><text x="165.0" y="363.0" font-family="Segoe UI, Noto Sans, Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="normal">опора есть: кандидат допустим</text><rect x="420.0" y="270.0" width="142.5" height="18.0" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/><rect x="562.5" y="390.0" width="150.0" height="18.0" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/><circle cx="510.0" cy="270.0" r="6.0" fill="#c2410c" stroke="#c2410c" stroke-width="1.5"/><line x1="510.0" y1="270.0" x2="510.0" y2="135.0" stroke="#c2410c" stroke-width="2" stroke-dasharray="4 3"/><text x="502.5" y="127.5" font-family="Segoe UI, Noto Sans, Arial, sans-serif" font-size="12" fill="#c2410c" text-anchor="middle" font-weight="normal">основание b</text><line x1="510.0" y1="270.0" x2="622.5" y2="270.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="622.5" y1="270.0" x2="622.5" y2="232.5" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="622.5" cy="232.5" r="5.0" fill="#0ea5e9" stroke="#0ea5e9" stroke-width="1.5"/><line x1="622.5" y1="232.5" x2="622.5" y2="322.5" stroke="#b91c1c" stroke-width="3" marker-end="url(#g15-support-arrow-bad)"/><text x="631.5" y="252.0" font-family="Segoe UI, Noto Sans, Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="normal">луч вниз 0.60</text><text x="727.5" y="378.0" font-family="Segoe UI, Noto Sans, Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="normal">земля ниже на 0.8 &gt; 0.35</text><text x="555.0" y="363.0" font-family="Segoe UI, Noto Sans, Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="normal">обрыв: нет попадания → кандидат отвергнут</text><text x="40.0" y="30.0" font-family="Segoe UI, Noto Sans, Arial, sans-serif" font-size="13" fill="#14212e" text-anchor="start" font-weight="normal">origin = b + d̂_escape·0.75 + (0, 0.25, 0); длина = 0.25 + 0.35 = 0.60</text><text x="40.0" y="52.0" font-family="Segoe UI, Noto Sans, Arial, sans-serif" font-size="13" fill="#14212e" text-anchor="start" font-weight="normal">нормаль попадания допустима при n̂·ŷ ≥ cos(θ_max) (для 45°: ≈ 0.7071)</text></svg>
